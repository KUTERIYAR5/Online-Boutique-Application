
name: "Continuous Integration - Main/Release"

on:
  push:
    branches:
      - main
      - "release/*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "kustomize/**"
      - "terraform/**"
      - "helm-chart/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  code-tests:
    name: Run Application Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            src/shippingservice/go.mod
            src/productcatalongservice/go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: Run Go unit tests
        timeout-minutes: 10
        run: |
          set -e
          for SERVICE in shippingservice productcatalogservice; do
            echo "Testing ${SERVICE}..."
            pushd "src/${SERVICE}"
            go test
            popd
          done

      - name: Run C# unit tests
        timeout-minutes: 10
        run: dotnet test src/cartservice/

  build-and-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-24.04
    needs: code-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Skaffold
        run: |
          curl -fsSL \
            https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 \
            -o skaffold
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold
          skaffold version

      - name: Configure image registry
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application images
        run: |
          skaffold build \
            --default-repo="$IMAGE_PREFIX" \
            --tag="$GITHUB_SHA" \
            --push
